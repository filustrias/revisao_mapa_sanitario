project:
  type: book
  output-dir: docs
  resources:
    - .nojekyll

lang: pt

book:
  title: "Mapa Sanitário — proposta de revisão do formulário"
  subtitle: "Ficha de Cadastramento de Unidades Sanitárias · versão 2 · documento para revisão"
  author: "GEPE/MINSA · OMS Angola · projecto HIIP"
  date: today
  date-format: long
  search: true
  sidebar:
    style: docked
    collapse-level: 2
  chapters:
    - index.qmd
    - formulario.qmd
    - formulario/01-identificacao.qmd
    - formulario/02-localizacao.qmd
    - formulario/03-populacao-referencia.qmd
    - formulario/04-construcao-estado-fisico.qmd
    - formulario/05-agua-energia-saneamento.qmd
    - formulario/06-conectividade.qmd
    - formulario/07-camas.qmd
    - formulario/08-aparelhos.qmd
    - formulario/09-transportes.qmd
    - formulario/10-clinicos-cirurgicos.qmd
    - formulario/11-diagnostico-apoio.qmd
    - formulario/12-crianca-vacinacao.qmd
    - formulario/13-materna-neonatal-pf.qmd
    - formulario/14-vih-tb-malaria.qmd
    - formulario/15-accao-comunitaria.qmd
    - formulario/16-gestao.qmd
    - formulario/17-servicos-gerais.qmd
  appendices:
    - formulario/99-correspondencia.qmd

format:
  html:
    theme: cosmo
    css: estilos.css
    include-after-body: comentar.html
    toc: true
    toc-depth: 3
    toc-title: "Nesta página"
    toc-expand: 2
    number-sections: false
    anchor-sections: true
    link-external-newwindow: true
    fontsize: 1.02rem
    linestretch: 1.55
    fig-cap-location: bottom
