project:
  type: book
  output-dir: docs
  resources:
    - .nojekyll
    - unidade_sanitaria_rural.jpeg

lang: pt

book:
  title: "Revisão da segunda versão do Mapa Sanitário (2026)"
  author: "Equipa do GEPE/MINSA, com apoio da OMS Angola"
  date: today
  date-format: long
  search: true
  sidebar:
    style: docked
    collapse-level: 2
  chapters:
    - text: "Capa"
      href: index.qmd
    - apresentacao.qmd
    - revisores.qmd
    - formulario.qmd
    - formulario/01-identificacao.qmd
    - formulario/02-localizacao.qmd
    - formulario/03-populacao-referencia.qmd
    - formulario/04-construcao-estado-fisico.qmd
    - formulario/05-agua-energia-saneamento.qmd
    - formulario/06-conectividade.qmd
    - formulario/07-transportes.qmd
    - formulario/08-camas.qmd
    - formulario/09-aparelhos.qmd
    - formulario/10-clinicos-cirurgicos.qmd
    - formulario/11-doencas-cronicas.qmd
    - formulario/12-diagnostico-apoio.qmd
    - formulario/13-urgencia.qmd
    - formulario/14-crianca-vacinacao.qmd
    - formulario/15-materna-neonatal-pf.qmd
    - formulario/16-vih-tb-malaria.qmd
    - formulario/17-accao-comunitaria.qmd
    - formulario/18-gestao.qmd
    - formulario/19-servicos-gerais.qmd

format:
  html:
    theme: cosmo
    css: estilos.css
    include-after-body: comentar.html
    toc: true
    toc-depth: 3
    toc-title: "Nesta página"
    toc-expand: 2
    number-sections: false
    anchor-sections: true
    link-external-newwindow: true
    fontsize: 1.02rem
    linestretch: 1.55
    fig-cap-location: bottom
