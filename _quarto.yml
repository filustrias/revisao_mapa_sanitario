project:
  type: book
  output-dir: docs
  resources:
    - .nojekyll

lang: pt

book:
  title: "Mapa Sanitário — proposta de revisão do formulário"
  subtitle: "Ficha de Cadastramento de Unidades Sanitárias · versão 2 · documento para revisão"
  author: "GEPE/MINSA · OMS Angola · projecto HIIP"
  date: today
  date-format: long
  search: true
  sidebar:
    style: docked
    collapse-level: 2
  chapters:
    - index.qmd
    - formulario.qmd
    - formulario/00-identificacao.qmd
    - formulario/01-localizacao.qmd
    - formulario/02-propriedade-gestao.qmd
    - formulario/03-populacao-referencia.qmd
    - formulario/04-construcao.qmd
    - formulario/05-estado-fisico.qmd
    - formulario/06-agua-energia-saneamento.qmd
    - part: formulario/07-servicos.qmd
      chapters:
        - formulario/07-1-clinicos-cirurgicos.qmd
        - formulario/07-2-apoio.qmd
        - formulario/07-3-saude-publica.qmd
        - formulario/07-4-gestao.qmd
        - formulario/07-5-gerais.qmd
    - formulario/08-13-por-transcrever.qmd

format:
  html:
    theme: cosmo
    css: estilos.css
    include-after-body: comentar.html
    toc: true
    toc-depth: 3
    toc-title: "Nesta página"
    toc-expand: 2
    number-sections: false
    anchor-sections: true
    link-external-newwindow: true
    fontsize: 1.02rem
    linestretch: 1.55
    fig-cap-location: bottom
