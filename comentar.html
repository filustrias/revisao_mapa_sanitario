<!-- Botão «Comentar» ao lado de cada quesito.
     Abre o Google Forms com o quesito, o nome, o email e a instituição já preenchidos.
     FORMULARIO é o link pré-preenchido do Google Forms, com os valores
     QUESITO, NOME, EMAIL e INSTITUICAO nos quatro campos; o script substitui-os.
     Os números entry.* identificam esses campos: se forem apagados e recriados
     no Forms, os números mudam.
     As opções de instituição têm de ser escritas exactamente como no Forms,
     senão a escolha não chega preenchida. -->
<dialog id="ms-identificacao">
  <form method="dialog">
    <p><strong>Identificação de quem comenta</strong></p>
    <p class="ms-dialogo-ajuda">Pedidos uma só vez: ficam guardados neste navegador e são preenchidos em cada comentário.</p>
    <label>Nome e apelido<input name="nome" required autocomplete="name"></label>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>Instituição
      <select name="instituicao" required>
        <option value="">Escolher…</option>
        <option>GEPE</option>
        <option>DNSP</option>
        <option>DNH</option>
        <option>Direção provincial</option>
        <option>Unidade sanitária</option>
      </select>
    </label>
    <div class="ms-dialogo-botoes">
      <button value="cancelar" formnovalidate>Cancelar</button>
      <button value="ok" class="ms-primario">Continuar</button>
    </div>
  </form>
</dialog>

<!-- O Google Forms abre aqui, por cima do documento, e a janela fecha-se sozinha depois do envio -->
<dialog id="ms-formulario">
  <div class="ms-formulario-topo">
    <span class="ms-formulario-titulo"></span>
    <a class="ms-formulario-separador" target="_blank" rel="noopener">abrir num separador ↗</a>
    <button type="button" class="ms-formulario-fechar" aria-label="Fechar">✕</button>
  </div>
  <div class="ms-formulario-carregar">A carregar o formulário…</div>
  <iframe title="Formulário de comentário"></iframe>
  <div class="ms-formulario-feito" hidden>✓ Comentário registado</div>
</dialog>

<script>
// Indicadores do HHFA: escondidos para os revisores; ?hhfa=1 mostra-os e lembra a escolha, ?hhfa=0 volta a escondê-los
(function () {
  const CHAVE = "ms-ver-hhfa";
  const p = new URLSearchParams(location.search).get("hhfa");
  try {
    if (p === "1") localStorage.setItem(CHAVE, "1");
    if (p === "0") localStorage.removeItem(CHAVE);
    if (localStorage.getItem(CHAVE) !== "1") return;
  } catch (e) { if (p !== "1") return; }
  document.documentElement.classList.add("ver-hhfa");
  const a = document.createElement("a");
  a.className = "ms-aviso-hhfa";
  a.href = location.pathname + "?hhfa=0";
  a.textContent = "Indicadores do HHFA visíveis · esconder";
  document.body.appendChild(a);
})();
</script>

<script>
(function () {
  const FORMULARIO = "https://docs.google.com/forms/d/e/1FAIpQLSfDjFs-JRnTNzo1DE_NoSEvp5mqZXCytSXS4VRUtO22RGqAlA/viewform?usp=pp_url"
    + "&entry.419732026=QUESITO&entry.1840941699=NOME&entry.145179400=EMAIL&entry.519699642=INSTITUICAO";
  if (!FORMULARIO.startsWith("https://")) return;

  const CHAVE = "ms-revisor";
  const dialogo = document.getElementById("ms-identificacao");
  const campo = function (n) { return dialogo.querySelector("[name=" + n + "]"); };
  let pendente = null;
  let aoMudar = function () {};

  function revisor() {
    try { return JSON.parse(localStorage.getItem(CHAVE)) || null; } catch (e) { return null; }
  }

  // Identificação guardada antes de existir o campo da instituição conta como incompleta
  function completo(quem) {
    return quem && quem.nome && quem.email && quem.instituicao;
  }

  // Janela do formulário. O iframe carrega uma vez ao abrir; a carga seguinte é a página
  // de confirmação do Google (o formulário tem uma só página e valida sem recarregar)
  const janela = document.getElementById("ms-formulario");
  const moldura = janela.querySelector("iframe");
  const feito = janela.querySelector(".ms-formulario-feito");
  let cargas = 0;
  let botaoActual = null;

  function fecharJanela() {
    if (janela.open) janela.close();
  }

  janela.addEventListener("close", function () {
    cargas = -1;
    moldura.src = "about:blank";
  });
  janela.querySelector(".ms-formulario-fechar").addEventListener("click", fecharJanela);

  moldura.addEventListener("load", function () {
    if (!janela.open || cargas < 0) return;
    cargas += 1;
    janela.classList.add("ms-carregado");
    if (cargas < 2) return;
    feito.hidden = false;
    if (botaoActual) botaoActual.classList.add("ms-comentado");
    setTimeout(fecharJanela, 1600);
  });

  function abrir(quesito, quem) {
    const url = FORMULARIO
      .replace("QUESITO", encodeURIComponent(quesito))
      .replace("NOME", encodeURIComponent(quem.nome))
      .replace("EMAIL", encodeURIComponent(quem.email))
      .replace("INSTITUICAO", encodeURIComponent(quem.instituicao));
    janela.querySelector(".ms-formulario-titulo").textContent = quesito;
    janela.querySelector(".ms-formulario-separador").href = url;
    feito.hidden = true;
    janela.classList.remove("ms-carregado");
    cargas = 0;
    moldura.src = url + "&embedded=true";
    janela.showModal();
  }

  function identificar(quesito) {
    const quem = revisor() || {};
    pendente = quesito;
    campo("nome").value = quem.nome || "";
    campo("email").value = quem.email || "";
    campo("instituicao").value = quem.instituicao || "";
    dialogo.showModal();
  }

  // A janela do formulário só se abre depois de a de identificação fechar
  // (duas janelas modais não podem estar abertas ao mesmo tempo)
  let aAbrir = null;
  dialogo.querySelector("form").addEventListener("submit", function (ev) {
    if (!ev.submitter || ev.submitter.value !== "ok") return;
    const quem = { nome: campo("nome").value.trim(), email: campo("email").value.trim(),
                   instituicao: campo("instituicao").value };
    try { localStorage.setItem(CHAVE, JSON.stringify(quem)); } catch (e) {}
    if (pendente) aAbrir = [pendente, quem];
    aoMudar();
  });
  dialogo.addEventListener("close", function () {
    pendente = null;
    if (aAbrir) { abrir(aAbrir[0], aAbrir[1]); aAbrir = null; }
  });

  function comentar(quesito) {
    const quem = revisor();
    if (completo(quem)) abrir(quesito, quem); else identificar(quesito);
  }

  function textoDo(titulo) {
    const copia = titulo.cloneNode(true);
    copia.querySelectorAll(".etiqueta, .anchorjs-link, .ms-comentar").forEach(function (n) { n.remove(); });
    return copia.textContent.replace(/\s+/g, " ").trim();
  }

  function botao(quesito, rotulo) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ms-comentar";
    b.textContent = "💬 " + rotulo;
    b.title = "Comentar: " + quesito;
    b.addEventListener("click", function () { botaoActual = b; comentar(quesito); });
    return b;
  }

  // Quesitos: títulos de nível 2 que começam por um código («0.1», «7.2.C.0», «1.1 a 1.5»)
  document.querySelectorAll("main h2").forEach(function (h) {
    const texto = textoDo(h);
    if (/^\d+(\.[0-9A-Za-z]+)+\b/.test(texto)) h.appendChild(botao(texto, "Comentar"));
  });

  // Comentário geral ao capítulo, junto ao título, com a identificação actual
  const titulo = document.querySelector("main h1.title");
  if (!titulo || !/^(Secç|\d|Domínios)/.test(textoDo(titulo))) return;
  const linha = document.createElement("div");
  linha.className = "ms-comentar-capitulo";
  linha.appendChild(botao(textoDo(titulo) + " (comentário geral)", "Comentar este capítulo"));
  const mudar = document.createElement("a");
  mudar.href = "#";
  mudar.className = "ms-mudar";
  mudar.addEventListener("click", function (ev) { ev.preventDefault(); identificar(null); });
  aoMudar = function () {
    const quem = revisor();
    mudar.textContent = completo(quem) ? "a comentar como " + quem.nome + " (" + quem.instituicao + ") · mudar" : "";
  };
  aoMudar();
  linha.appendChild(mudar);
  titulo.parentElement.after(linha);
})();
</script>
